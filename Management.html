<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f6fa;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        h1 {
            margin-bottom: 25px;
            color: #222;
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .kpi-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .kpi-card h3 {
            font-size: 15px;
            color: #777;
            margin-bottom: 10px;
        }

        .kpi-card p {
            font-size: 25px;
            font-weight: bold;
        }

        .sales {
            border-left: 5px solid #4caf50;
        }

        .orders {
            border-left: 5px solid #2196f3;
        }

        .cost {
            border-left: 5px solid #ff9800;
        }

        .profit {
            border-left: 5px solid #9c27b0;
        }

    
        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        
        .cost-item {
            margin-bottom: 20px;
        }

        .cost-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            font-size: 14px;
        }

        .progress-container {
            width: 100%;
            height: 18px;
            background-color: #e9e9e9;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 10px;
        }

        .raw-materials {
            width: 70%;
            background-color: #ff6b6b;
        }

        .labor {
            width: 40%;
            background-color: #4dabf7;
        }

        .transport {
            width: 20%;
            background-color: #ffd43b;
        }

        .utilities {
            width: 17%;
            background-color: #69db7c;
        }

        .other {
            width: 10%;
            background-color: #b197fc;
        }

        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .warning {
            background-color: #fff3cd;
            border-left: 5px solid #ffc107;
            color: #856404;
        }

        .success {
            background-color: #d4edda;
            border-left: 5px solid #28a745;
            color: #155724;
        }

        .alert strong {
            display: block;
            margin-bottom: 5px;
        }

        
        @media (max-width: 800px) {
            .kpi-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .kpi-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Management Dashboard</h1>

        <!-- KPI METRICS -->
        <div class="kpi-container">

            <div class="kpi-card sales">
                <h3>Total Sales</h3>
                <p id="totalSales">₱125,000</p>
            </div>

            <div class="kpi-card orders">
                <h3>Total Orders</h3>
                <p id="totalOrders">245</p>
            </div>

            <div class="kpi-card cost">
                <h3>Total Cost</h3>
                <p id="totalCost">₱78,500</p>
            </div>

            <div class="kpi-card profit">
                <h3>Total Profit</h3>
                <p id="totalProfit">₱46,500</p>
            </div>

        </div>



        <div class="section">

            <h2>Cost Breakdown</h2>

            <div class="cost-item">
                <div class="cost-info">
                    <span>Raw Materials</span>
                    <span>₱35,000</span>
                </div>

                <div class="progress-container">
                    <div class="progress-bar raw-materials"></div>
                </div>
            </div>


            <div class="cost-item">
                <div class="cost-info">
                    <span>Labor Cost</span>
                    <span>₱20,000</span>
                </div>

                <div class="progress-container">
                    <div class="progress-bar labor"></div>
                </div>
            </div>


            <div class="cost-item">
                <div class="cost-info">
                    <span>Transportation</span>
                    <span>₱10,000</span>
                </div>

                <div class="progress-container">
                    <div class="progress-bar transport"></div>
                </div>
            </div>


            <div class="cost-item">
                <div class="cost-info">
                    <span>Utilities</span>
                    <span>₱8,500</span>
                </div>

                <div class="progress-container">
                    <div class="progress-bar utilities"></div>
                </div>
            </div>


            <div class="cost-item">
                <div class="cost-info">
                    <span>Other Expenses</span>
                    <span>₱5,000</span>
                </div>

                <div class="progress-container">
                    <div class="progress-bar other"></div>
                </div>
            </div>

        </div>


        
        <div class="section">

            <h2>Discrepancy Alerts</h2>

            <div id="alertContainer"></div>

        </div>

    </div>


    <script>

    
        const transactions = [
            {
                name: "Transaction #001",
                expected: 5000,
                actual: 5000
            },
            {
                name: "Transaction #002",
                expected: 7500,
                actual: 7000
            },
            {
                name: "Transaction #003",
                expected: 3000,
                actual: 3500
            },
            {
                name: "Transaction #004",
                expected: 4500,
                actual: 4500
            }
        ];


        
        const alertContainer = document.getElementById("alertContainer");


        
        transactions.forEach(transaction => {

            if (transaction.expected !== transaction.actual) {

                const difference =
                    transaction.actual - transaction.expected;

                const alert = document.createElement("div");

                alert.className = "alert warning";

                alert.innerHTML = `
                    <strong>⚠ ${transaction.name}</strong>
                    Expected Amount: ₱${transaction.expected.toLocaleString()}<br>
                    Actual Amount: ₱${transaction.actual.toLocaleString()}<br>
                    Difference: ₱${Math.abs(difference).toLocaleString()}
                `;

                alertContainer.appendChild(alert);

            }

        });


        
        if (alertContainer.innerHTML === "") {

            alertContainer.innerHTML = `
                <div class="alert success">
                    <strong>✓ No Discrepancies</strong>
                    All transactions are properly matched.
                </div>
            `;

        }

    </script>

</body>
</html>
